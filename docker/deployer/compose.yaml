services:
  deployer:
    # Image is built in GitHub Actions and published to
    # https://github.com/dirty-cache/shadowlab/packages
    image: ghcr.io/dirty-cache/shadowlab/deployer:${DEPLOYER_TAG:-latest}
    container_name: deployer
    restart: unless-stopped
    ports:
      - ${COMPOSE_PORT_HTTP:-8080}:8080
    environment:
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:-}
      DOCKHAND_URL: ${DOCKHAND_URL:?set DOCKHAND_URL}
      DOCKHAND_TOKEN: ${DOCKHAND_TOKEN:-}
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/dirty-cache/shadowlab.git}
      GIT_BRANCH: ${GIT_BRANCH:-master}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_CREDENTIAL_ID: ${GIT_CREDENTIAL_ID:-}
