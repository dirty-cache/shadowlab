services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    container_name: homepage
    ports:
      - 3002:3000
    volumes:
      - config:/app/config
      - icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.shadowlab.lan,192.168.70.12:3002,homepage.shadow.lab"
      HOMEPAGE_VAR_NAME: "Management"

volumes:
    config:
    icons:

