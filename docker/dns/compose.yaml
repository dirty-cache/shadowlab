services:
  dns-server:
    container_name: dns-server
    hostname: dns-server
    image: docker.io/technitium/dns-server:latest
    network_mode: "host"
    environment:
      - DNS_SERVER_DOMAIN=dns-server
      - DNS_SERVER_WEB_SERVICE_HTTPS_PORT=53443 #The TCP port number for the DNS web console over HTTPS protocol.
      - DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS=true #Enables HTTPS for the DNS web console.
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns #The folder path on the server where the log files should be saved.
    volumes:
      - config:/etc/dns
      - logs:/var/log/technitium/dns
      # /usr/local/etc/dirty_cache_root_ca.crt:/usr/local/share/ca-certificates/dirty-cache-root-ca.crt:ro
    restart: unless-stopped
    # sysctls:
      # - net.ipv4.ip_local_port_range=1024 65535 #remove when using "host" network mode

volumes:
    config:
    logs:
