services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - ${COMPOSE_PORT_HTTP:-4000}:4000
    volumes:
      - config:/config
    command: ["--config", "/config/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      # LITELLM_MASTER_KEY=4dcbd4037aa34445dce7d0520fa710d072ee6aef82494a993188ba8245688742
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${LITELLM_DB_URL}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
    config:
