networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:17
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    restart: always
    networks:
      - forgejo
    volumes:
      - data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '4000:3000'
      - '192.168.70.4:22:22'
    # update cert:
    # docker exec forgejo exec /usr/sbin/update-ca-certificates

volumes:
    data:
