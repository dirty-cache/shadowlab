networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    restart: always
    networks:
      - forgejo
    volumes:
      - data:/data
      # /usr/local/etc/dirty_cache_root_ca.crt:/usr/local/share/ca-certificates/atc-root-ca.crt:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '${HTTP_LISTEN_IP}:443:3000'
      - '${SSH_LISTEN_IP}:22:22'
    # update cert:
    # docker exec forgejo exec /usr/sbin/update-ca-certificates

volumes:
    data:
