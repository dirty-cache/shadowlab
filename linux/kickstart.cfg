# version=RHEL9

# Use graphical install
graphical

%addon com_redhat_kdump --disable

firewall --service=ssh
selinux --disabled

%end

# Keyboard layouts
keyboard --xlayouts='us'
# System language
lang en_US.UTF-8

# Use CDROM installation media
cdrom

# Settings (network etc)
%include /mnt/oemdrv/settings.cfg

# Reboot after install
reboot

%packages
@^minimal-environment
@headless-management
-iwl*firmware
-linux-firmware

%end

#######################################################################################
# Pre script (optional customization)                                                 #
#######################################################################################

%pre
# Mount the OEMDRV disk so the extra kickstart snippets can be included
mkdir -p /mnt/oemdrv
mount -o ro /dev/disk/by-label/OEMDRV /mnt/oemdrv
%end

# Run the Setup Agent on first boot
firstboot --enable

# Boot disk
ignoredisk --only-use=/dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_boot
autopart
# Partition clearing information
clearpart --none --initlabel

# System timezone
timezone Europe/Amsterdam --utc

# Root password
%include /mnt/oemdrv/rootpass.cfg

# Ansible automation account. Password login is locked
user --name=ansible --groups=wheel --uid=900 --gid=900 --gecos="Ansible" --shell=/bin/bash --lock

#######################################################################################
# Post (chroot) script (optional customization)                                       #
#######################################################################################
%post --log=/var/log/ks-post-chroot.log --interpreter=/bin/bash

dnf -y install net-tools qemu-guest-agent bash-completion git sudo

install -d -m 0750 /etc/sudoers.d
cat > /etc/sudoers.d/ansible <<'EOF'
ansible ALL=(ALL) NOPASSWD:ALL
EOF
chmod 0440 /etc/sudoers.d/ansible
visudo -cf /etc/sudoers.d/ansible

install -d -m 0700 /root/.ssh
install -d -m 0700 -o ansible -g ansible /home/ansible/.ssh

mkdir -p /mnt/oemdrv
if mount -o ro /dev/disk/by-label/OEMDRV /mnt/oemdrv; then
  if [ -f /mnt/oemdrv/authorized_keys ]; then
    install -m 0600 /mnt/oemdrv/authorized_keys /root/.ssh/authorized_keys
    install -m 0600 -o ansible -g ansible /mnt/oemdrv/authorized_keys /home/ansible/.ssh/authorized_keys
  fi
  umount /mnt/oemdrv
fi

cd /root
git clone https://github.com/dirty-cache/shadowlab.git


%end
