---
# Set DNS-over-TLS forwarders after the container is up.
#
#   ansible-galaxy collection install -r ansible/technitium/requirements.yml
#   ansible-playbook ansible/technitium/init.yml
#
# Log in to the web console first, create an API token, and put it in
# technitium_api_token in ansible/group_vars/technitium.yml.
# Zones and records are ansible/technitium/zones.yml.
# api_url must not include the port; the collection appends it.

- name: Initialize Technitium DNS
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - defaults.yml

  tasks:
    - name: Load the API token
      ansible.builtin.include_tasks: tasks/load_token.yml

    - name: API token is required
      ansible.builtin.fail:
        msg: >-
          No Technitium API token. Create one in the web console and set
          technitium_api_token in ansible/group_vars/technitium.yml.
      when: technitium_token is not defined

    - name: Set DNS-over-TLS forwarders
      effectivelywild.technitium_dns.technitium_dns_set_server_settings:
        api_url: "{{ technitium_url }}"
        api_port: "{{ technitium_port }}"
        validate_certs: "{{ technitium_validate_certs }}"
        api_token: "{{ technitium_token }}"
        forwarders: "{{ technitium_forwarders }}"
        forwarderProtocol: "{{ technitium_forwarder_protocol }}"
